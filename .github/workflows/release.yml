name: Release

# Conventional Commits em master -> versão, tag, GitHub Release e latest.json (auto-update do app).
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.next.outputs.release }}
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        run: |
          out=$(node tools/release.mjs --apply)
          echo "$out"
          echo "release=$(jq -r .release <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.version // ""' <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r '.tag // ""' <<<"$out")" >> "$GITHUB_OUTPUT"
          jq -r '.notes // ""' <<<"$out" > "$RUNNER_TEMP/notes.md"
      - name: Commit version bump and tag
        if: steps.next.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cargo metadata --format-version 1 >/dev/null
          git add Cargo.toml Cargo.lock installer/package.json
          git commit -m "chore(release): ${{ steps.next.outputs.tag }} [skip ci]"
          git tag "${{ steps.next.outputs.tag }}"
          git push origin HEAD:master --follow-tags
      - uses: actions/upload-artifact@v4
        if: steps.next.outputs.release == 'true'
        with:
          name: notes
          path: ${{ runner.temp }}/notes.md

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: notes
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: installer/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm --dir installer install --frozen-lockfile
      - id: notes
        shell: bash
        run: |
          { echo 'body<<EOF'; cat notes/notes.md; echo EOF; } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: installer
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Soul Reaver PT-BR ${{ needs.version.outputs.tag }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
