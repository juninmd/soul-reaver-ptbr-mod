name: CI

# O release publica a cada push em master; este job roda o core Rust em todo PR antes disso.
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check -p soul-reaver-mod-core
      - run: cargo clippy --locked -p soul-reaver-mod-core --all-targets -- -D warnings
      - run: cargo test --locked -p soul-reaver-mod-core
