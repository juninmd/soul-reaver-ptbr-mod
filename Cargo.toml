[workspace]
members = ["crates/mod-core", "installer/src-tauri"]
default-members = ["crates/mod-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
fs2 = "=0.4.3"
sysinfo = "=0.39.6"
tempfile = "=3.27.0"
tauri = { version = "=2.12.4" }
tauri-build = { version = "=2.7.3" }
tauri-plugin-dialog = { version = "=2.8.3" }
soul-reaver-mod-core = { path = "crates/mod-core" }
